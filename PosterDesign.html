        <style>
          .animate1, .animate2 {
            width: 100%;
            max-width: 200vh;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            max-inline-size: none;
            background-color: white;
            align-items: center;
            margin: 0;
            position: relative;
            perspective: 1500px;

            div {
              height: 100%;
              width: 100%;
              overflow: hidden;
              margin-left: 0 !important;
              margin-right: 0 !important;
              overflow-x: hidden !important;
              aspect-ratio: 16 / 9 !important;
            }

            img {
              position: absolute;
              overflow: hidden;
              animation-duration: 2s;
              animation-direction: alternate;
              animation-iteration-count: infinite;
              animation-timing-function: ease-out;
            }
          }

          .animate2 {

            
            img:nth-child(1) {
              animation-name: one;
            }
            
            img:nth-child(2) {
              animation-name: two;
              top: -3.24%;
            }
            
            img:nth-child(3) {
              animation-name: three;
              mix-blend-mode: multiply;
            }
          }
          
          .animate1 {

            div {
              position: absolute;
              animation-duration: 2s;
              animation-direction: alternate;
              animation-iteration-count: infinite;
              animation-timing-function: ease-out;
            }

            img {
              animation-duration: 2s;
              animation-direction: alternate;
              animation-iteration-count: infinite;
              animation-timing-function: ease-out;    
            }
            
            > div:nth-child(2) {
              animation-name: slide;


              img {
                animation-name: reverse-slide;
                transform: translateX(100%);
              }
            }

            > div:nth-child(3) {
              animation-name: slide;
              animation-delay: 0.75s;

              img {
                animation-name: reverse-slide;
                animation-delay: 0.75s;
                transform: translateX(100%);
              }
            }            
          }

          @keyframes slide {
            
            0% {
              transform: translateX(-100%);
            }

            40% {
              transform: translateX(-100%);
            }

            70% {
              transform: translateX(0%);
            }

            100% {
              transform: translateX(0%);
            }
          }

          @keyframes reverse-slide {
                        
            0% {
              transform: translateX(100%);
            }

            40% {
              transform: translateX(100%);
            }

            70% {
              transform: translateX(0%);
            }

            100% {
              transform: translateX(0%);
            }
          }

          @keyframes one {
            0% {
              bottom: 0%;
            }
            40% {
              bottom: 0%;
            }
            80% {
              bottom: -3.24%;
            }
            100% {
              bottom: -3.24%;
            }
          }

          @keyframes two {
            0% {
              transform: translateZ(0) 
            }
            40% {
              transform: translateZ(0) 
            }
            80% {
             transform: translateZ(10px)
            }
            100% {
             transform: translateZ(10px)
            }
          }

          @keyframes three {
            0% {
              top: 0%;
              transform: translateZ(0)         
            }
            40% {
              top: 0%;
              transform: translateZ(0)              
            }
            80% {
              top: -3.24%;
              transform: translateZ(20px)
            }
            100% {
              top: -3.24%;
              transform: translateZ(20px)
            }
          }

          @media (max-width: 605px) {
            .animate1, .animate2 {
                height: calc(165vw * 9 / 16) !important;
                position: relative !important;
                width: 165vw !important;
                overflow: visible;

                div {
                  position: absolute !important;
                }

                img {
                  margin-left: 0 !important;
                  margin-right: 0 !important;
                }
            }
          }

        </style>
